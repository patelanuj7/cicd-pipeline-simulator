name: pipeline

on:
  push:
  pull_request:

# A newer push to the same branch (or PR) cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci

      - run: python -m pip install pytest

      - run: bash scripts/run-tests.sh

      # Upload even when tests fail: that's when the reports matter most.
      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports
          path: reports/
          if-no-files-found: error

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Pull requests build the image to prove it builds, but never publish it.
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<7 chars> on every build; latest only on the default branch (main).
      # Also adds OCI labels, including the source repo that GHCR links the package to.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cicd-pipeline-simulator-service
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Context is the repo root so the image can npm ci against the root lockfile.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: service/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SERVICE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check deploy configuration
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          [ -n "$DEPLOY_HOOK_URL" ] || { echo "::error::Secret DEPLOY_HOOK_URL is not set"; exit 1; }
          [ -n "$SERVICE_URL" ] || { echo "::error::Variable SERVICE_URL is not set"; exit 1; }

      # Pass imgURL so Render deploys this exact build (sha-<7 chars>, the tag the
      # build job pushed) rather than whatever :latest points to at that moment.
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cicd-pipeline-simulator-service
        run: |
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          echo "Deploying $IMAGE"
          encoded=$(jq -rn --arg v "$IMAGE" '$v | @uri')
          curl --fail-with-body --silent --show-error -X POST "${DEPLOY_HOOK_URL}&imgURL=${encoded}"
          echo

      # The deploy only counts once the new commit is the one answering /health.
      - name: Verify new version is live
        run: python scripts/healthcheck.py --url "${{ vars.SERVICE_URL }}" --expect-sha "${{ github.sha }}"
